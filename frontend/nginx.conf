map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Matches the backend's own multipart limit (application.yml,
    # spring.servlet.multipart.max-file-size/max-request-size) — proof-of-payment
    # and POD/in-scan photo uploads otherwise 413 here before ever reaching Spring,
    # with an HTML error body the frontend can't parse into a useful message.
    client_max_body_size 25m;

    # Backend API, incl. websocket upgrade for real-time driver tracking.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Angular routing: unmatched paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
