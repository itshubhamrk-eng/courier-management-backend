       font-display at all, so before it loads a mat-icon's ligature text ("mail", "lock")
       renders as literal, clipped readable words instead of the glyph. block hides that
       gap (a short invisible period, then swap) instead of showing it. -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block" rel="stylesheet" />
